name: Extract Sawt source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract recovered source
        run: |
          test -f sawt-workspace-fixed-source.zip
          unzip -o sawt-workspace-fixed-source.zip -d .
          rm sawt-workspace-fixed-source.zip
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Extract Sawt workspace source"
            git push origin HEAD:main
          fi
