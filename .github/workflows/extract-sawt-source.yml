name: Extract Sawt source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify recovered source
        shell: bash
        run: |
          set -euo pipefail
          test -d parts
          cat parts/part-* > sawt.b64
          base64 --decode sawt.b64 > sawt-workspace-fixed-source.zip
          echo "cc07f9a1c57d7b90b564db715d4e7186c3a35357970fc638edcdca982fd6d574  sawt-workspace-fixed-source.zip" | sha256sum -c -
          unzip -t sawt-workspace-fixed-source.zip
          unzip -o sawt-workspace-fixed-source.zip -d .
          rm -rf parts sawt.b64 sawt-workspace-fixed-source.zip

      - name: Validate JavaScript and JSON
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check service-worker.js
          node --check netlify/functions/collab.mjs
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'));"

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Extract verified Sawt workspace source"
            git push origin HEAD:main
          fi
